# Шаг 2: HTTP + HTTPS. Подключается рядом с другими сайтами, SNI различает домены.
server {
    listen 80;
    listen [::]:80;
    server_name dekanat.testvless.space;
    location /.well-known/acme-challenge/ { root /var/www/dekanat-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dekanat.testvless.space;
    ssl_certificate     /etc/letsencrypt/live/dekanat.testvless.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dekanat.testvless.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DEKANATSSL:5m;
    root /var/www/dekanat;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location / { try_files $uri /index.html; }
}
