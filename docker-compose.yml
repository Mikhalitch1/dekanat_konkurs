name: digital-dekanat
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dekanat
      POSTGRES_DB: dekanat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    ports: ["127.0.0.1:${DB_PORT:-54329}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dekanat -d dekanat"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://dekanat:${POSTGRES_PASSWORD}@postgres:5432/dekanat
      APP_ORIGIN: https://localhost:${HTTPS_PORT:-8443}
      NODE_ENV: production
      DEMO_PASSWORD_STUDENT_ARTEM: ${DEMO_PASSWORD_STUDENT_ARTEM:?Required}
      DEMO_PASSWORD_STUDENT_LINA: ${DEMO_PASSWORD_STUDENT_LINA:?Required}
      DEMO_PASSWORD_STAFF: ${DEMO_PASSWORD_STAFF:?Required}
      PII_KEY: ${PII_KEY:?Run npm run setup:local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/tls:/etc/nginx/tls:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
volumes:
  pgdata:
